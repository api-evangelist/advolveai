aid: advolveai
name: Advolve.AI
description: 'Advolve.AI is an AI-driven performance-marketing and customer-acquisition platform for
  e-commerce brands and marketplaces, offering an end-to-end solution to automate, scale, and optimize
  paid media and digital advertising, including a patent-pending creative-optimization capability that
  tunes interactive ad elements (messaging, graphics, colors, fonts). Founded in 2023 and headquartered
  in Sao Paulo, Brazil, Advolve was backed by Prosus Ventures and Valor Capital and was acquired by
  iFood (Prosus group) in November 2025 to power iFood Ads across Latin America. Advolve publishes a
  marketing website only; as of enrichment it exposes no public developer program, API, SDKs, or
  documentation surface.'
