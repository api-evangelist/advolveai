  live GET of /.well-known/*, /llms.txt and the contract-discovery paths on every Advolve host
  reachable from apis.yml, the sitemap, the production SPA bundle and DNS
summary: >-
  Advolve publishes no /.well-known/ discovery surface, no llms.txt and no machine-readable
  contract on any host. advolve.ai is a five-route React single-page app served from Cloudflare
  that answers HTTP 200 with the SAME 984-byte HTML shell for EVERY path — including
  /.well-known/security.txt, /.well-known/agent-card.json, /openapi.json and /llms.txt. Those
  200s are soft 404s, not documents: byte-identical shells with `<div id="root"></div>` and no
  payload. They are recorded here as MISSES and NO WellKnown, SecurityTxt, AgentCard or LLMsTxt
  pointer is wired in apis.yml — a 200 that returns an SPA shell is an absence, and a pointer
  would assert a surface the provider does not serve. The only non-marketing host,
  app.advolve.ai, is the customer application behind Cloudflare Access and 302s every path to
  advolve.cloudflareaccess.com. No api./docs./developer./portal./console. subdomain resolves.
