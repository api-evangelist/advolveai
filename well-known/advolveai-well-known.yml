findings:
- id: spa-soft-200-catch-all
  severity: medium
  detail: >-
    advolve.ai returns HTTP 200 for every path that does not exist, serving the same 984-byte
    SPA shell. Any probe that trusts a status code alone would record a security.txt, an agent
    card, an llms.txt and an OpenAPI that do not exist. Every /.well-known/ entry above is
    therefore graded on the BODY, and all are misses.
  evidence:
  - url: https://advolve.ai/.well-known/agent-card.json
    status: 200
    finding: text/html, 984 bytes, byte-identical to the homepage shell
  - url: https://advolve.ai/openapi.json
    status: 200
    finding: text/html, 984 bytes, byte-identical to the homepage shell
- id: contact-api-host-nxdomain
  severity: low
  detail: >-
    The production SPA bundle (/assets/index-D5QRx9mZ.js) posts the site contact form to
    https://landing-page-api.advolve.ai/contacts. That hostname does not resolve — NXDOMAIN at
    1.1.1.1 and 8.8.8.8 — so the only Advolve-operated HTTP API referenced anywhere in public
    code is dead, and the marketing site's contact form is broken as shipped. This is the sole
    API host name Advolve exposes publicly, and it is a first-party form backend, not a product
    API.
  evidence:
  - url: https://landing-page-api.advolve.ai/contacts
    status: 0
    finding: NXDOMAIN — could not resolve host (verified against 1.1.1.1 and 8.8.8.8)
- id: no-developer-subdomains
  severity: low
  detail: >-
    api., docs., developer., developers., portal., dashboard., platform., admin., console. and
    studio..advolve.ai all return NXDOMAIN. app.advolve.ai is the only subdomain that resolves,
    and it is Cloudflare Access-protected.
  evidence:
